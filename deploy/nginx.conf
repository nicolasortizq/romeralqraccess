# Nginx site config for acceso.vallederomeral.cl (romeralQRAccess backend API).
#
# Install as /etc/nginx/conf.d/acceso.vallederomeral.cl.conf (setup_vps.sh
# does this). This file is the HTTP (port 80) bootstrap: it is what must be
# in place, and nginx reloaded, BEFORE certbot can issue a certificate for
# this domain, because `certbot --nginx` works by finding and editing the
# live server block for the requested server_name.
#
# `certbot --nginx` (run by setup_vps.sh) edits the installed copy of this
# file in place on first success: it adds a "listen 443 ssl" server block
# using the Let's Encrypt certificate at
#   /etc/letsencrypt/live/acceso.vallederomeral.cl/fullchain.pem
#   /etc/letsencrypt/live/acceso.vallederomeral.cl/privkey.pem
# and turns this port 80 block into a 301 redirect to https (the --redirect
# flag passed by setup_vps.sh). Certbot's renewal timer only refreshes the
# certificate files afterwards; it does not touch this structure again.
#
# Do not hand-add a 443 block here: it would make certbot's first run
# ambiguous about which server block to edit. If this file is ever
# reinstalled from the repo (e.g. after rebuilding the VPS), re-run
# `certbot --nginx` to restore the 443 block and redirect.

server {
    listen 80;
    listen [::]:80;
    server_name acceso.vallederomeral.cl;

    # Ticket emails embed a QR PNG and the redeem API returns small JSON
    # payloads; there is no file upload path, so keep this tight.
    client_max_body_size 4M;

    access_log /var/log/nginx/acceso.vallederomeral.cl.access.log;
    error_log  /var/log/nginx/acceso.vallederomeral.cl.error.log;

    # Django admin static assets, served directly by Nginx.
    # Requires `python manage.py collectstatic` to have been run with
    # STATIC_ROOT pointing here.
    location /static/ {
        alias /srv/romeral/app/backend/staticfiles/;
    }

    location / {
        proxy_pass http://unix:/run/romeral/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
